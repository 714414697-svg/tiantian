<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 爱的问答 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 90%;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #ff6b9d;
            font-size: 2.2em;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .heart {
            font-size: 4em;
            color: #ff6b9d;
            animation: heartbeat 1.5s infinite;
            margin: 20px 0;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.1);
            }
            50% {
                transform: scale(1);
            }
            75% {
                transform: scale(1.1);
            }
        }

        .question-counter {
            color: #ff6b9d;
            font-size: 1em;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .message {
            font-size: 1.3em;
            color: #333;
            line-height: 1.8;
            margin: 20px 0;
            min-height: 80px;
        }

        .typing-text {
            border-right: 3px solid #ff6b9d;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 100% {
                border-color: transparent;
            }
            50% {
                border-color: #ff6b9d;
            }
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 35px;
            font-size: 1.1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            min-width: 120px;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff9a9e 0%, #ff6b9d 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.4);
        }

        .btn-yes:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.6);
        }

        .btn-no {
            background: #ecf0f1;
            color: #7f8c8d;
            position: relative;
        }

        .btn-no:hover {
            background: #bdc3c7;
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .floating-heart {
            position: absolute;
            font-size: 2em;
            animation: float 6s infinite;
            opacity: 0.6;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #ffe0e6;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff9a9e 0%, #ff6b9d 100%);
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        .final-message {
            display: none;
            animation: celebrate 1s ease-in;
        }

        .final-message h2 {
            color: #ff6b9d;
            font-size: 2.5em;
            margin: 20px 0;
        }

        .final-message p {
            font-size: 1.3em;
            color: #333;
            line-height: 1.8;
            margin: 15px 0;
        }

        @keyframes celebrate {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .emoji-display {
            font-size: 4em;
            margin: 20px 0;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .love-letter {
            display: none;
            background: linear-gradient(135deg, #fff5f7 0%, #ffe0e6 100%);
            padding: 30px;
            border-radius: 15px;
            margin-top: 20px;
            border: 3px solid #ff6b9d;
            text-align: left;
        }

        .love-letter h3 {
            color: #ff6b9d;
            font-size: 1.8em;
            margin-bottom: 15px;
            text-align: center;
        }

        .love-letter p {
            font-size: 1.1em;
            color: #555;
            line-height: 2;
            text-indent: 2em;
        }

        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .message {
                font-size: 1.1em;
            }

            button {
                padding: 12px 25px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="floatingHearts"></div>
    
    <div class="container">
        <div class="heart">💖</div>
        
        <div id="quizSection">
            <div class="question-counter" id="questionCounter">问题 1 / 5</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 20%"></div>
            </div>
            <h1 id="questionTitle">准备好了吗？</h1>
            <div class="message" id="message"></div>
            
            <div class="buttons" id="buttons">
                <button class="btn-yes" onclick="handleAnswer(true)">准备好了 💕</button>
                <button class="btn-no" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">还没呢</button>
            </div>
        </div>

        <div class="final-message" id="finalMessage">
            <div class="emoji-display">🎉💕🎊</div>
            <h2>恭喜你！全部通过！</h2>
            <p>你已经成为我心中最重要的人了！</p>
            <p>从这一刻起，让我们一起创造美好回忆 ❤️</p>
        </div>

        <div class="love-letter" id="loveLetter">
            <h3>💌 给你的情书 💌</h3>
            <p>亲爱的，感谢你陪我走完这些问答。每一个问题都是我想对你说的话，每一个答案都让我更加确定你就是我要找的人。</p>
            <p>在这个特别的时刻，我想告诉你：无论未来的路有多长，我都会牵着你的手一起走下去。无论是晴天还是雨天，无论是快乐还是困难，我都会陪在你身边。</p>
            <p>你是我生命中最美的风景，是我最温暖的阳光，是我最甜蜜的梦境。我愿意用我的一生来爱你、守护你、珍惜你。</p>
            <p style="text-align: right; margin-top: 20px; color: #ff6b9d; font-weight: bold;">永远爱你的我 ❤️</p>
        </div>
    </div>

    <script>
        const questions = [
            {
                title: "第一个问题",
                message: "遇见你，是我今生最美的意外。你知道吗？每次看到你，我的心都会不由自主地加速跳动。你愿意给我一个机会，让我走进你的生活吗？",
                yesText: "愿意 💕",
                noText: "再想想"
            },
            {
                title: "第二个问题",
                message: "你的笑容就像春天的阳光，温暖而明亮。我想每天都能看到你的笑容，想成为那个让你开心的人。你愿意让我陪伴在你身边吗？",
                yesText: "当然愿意 🌟",
                noText: "考虑一下"
            },
            {
                title: "第三个问题",
                message: "我想和你一起去看遍世间的风景，一起品尝美食，一起分享生活中的点点滴滴。不管是高山还是大海，只要有你在，哪里都是天堂。你愿意和我一起旅行吗？",
                yesText: "一起去 ✈️",
                noText: "太远了"
            },
            {
                title: "第四个问题",
                message: "生活中难免会有风雨，但我相信只要我们在一起，就没有什么困难是过不去的。我想成为你的依靠，在你需要的时候给你温暖的怀抱。你愿意让我保护你吗？",
                yesText: "相信你 💪",
                noText: "不确定"
            },
            {
                title: "最后一个问题",
                message: "经过这么多问题，我的心意依然坚定。我想正式地问你：你愿意做我的另一半，和我一起走过余生，共同创造属于我们的幸福故事吗？",
                yesText: "我愿意！💖",
                noText: "让我想想"
            }
        ];

        let currentQuestion = 0;
        let charIndex = 0;
        let isTyping = false;
        const messageElement = document.getElementById('message');
        const questionTitle = document.getElementById('questionTitle');
        const questionCounter = document.getElementById('questionCounter');
        const progressFill = document.getElementById('progressFill');
        const yesBtn = document.querySelector('.btn-yes');
        const noBtn = document.getElementById('noBtn');

        function typeWriter() {
            if (currentQuestion < questions.length) {
                const currentQ = questions[currentQuestion];
                
                if (charIndex < currentQ.message.length) {
                    messageElement.innerHTML = currentQ.message.substring(0, charIndex + 1) + '<span class="typing-text"></span>';
                    charIndex++;
                    setTimeout(typeWriter, 50);
                } else {
                    isTyping = false;
                    yesBtn.textContent = currentQ.yesText;
                    noBtn.textContent = currentQ.noText;
                }
            }
        }

        function loadQuestion() {
            if (currentQuestion >= questions.length) {
                showFinalMessage();
                return;
            }

            const currentQ = questions[currentQuestion];
            questionTitle.textContent = currentQ.title;
            questionCounter.textContent = `问题 ${currentQuestion + 1} / ${questions.length}`;
            progressFill.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            
            messageElement.innerHTML = '';
            charIndex = 0;
            isTyping = true;
            
            yesBtn.textContent = '加载中...';
            noBtn.textContent = '...';
            
            setTimeout(() => {
                typeWriter();
            }, 300);
        }

        function handleAnswer(isYes) {
            if (isTyping) return;
            
            if (isYes) {
                createMiniCelebration();
                currentQuestion++;
                
                if (currentQuestion >= questions.length) {
                    showFinalMessage();
                } else {
                    setTimeout(() => {
                        loadQuestion();
                    }, 500);
                }
            }
        }

        function moveButton() {
            if (isTyping) return;
            
            const container = document.querySelector('.container');
            const containerRect = container.getBoundingClientRect();
            const noBtnRect = noBtn.getBoundingClientRect();
            
            const maxX = containerRect.width - noBtnRect.width - 20;
            const maxY = 100;
            
            const randomX = Math.random() * maxX - (maxX / 2);
            const randomY = Math.random() * maxY - (maxY / 2);
            
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
            
            setTimeout(() => {
                noBtn.style.transform = 'translate(0, 0)';
            }, 1000);
        }

        function createFloatingHearts() {
            const container = document.getElementById('floatingHearts');
            const hearts = ['💕', '💖', '💗', '💓', '💝', '💘'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
                container.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 6000);
            }, 400);
        }

        function createMiniCelebration() {
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'floating-heart';
                    heart.textContent = '💖';
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.top = '50%';
                    heart.style.animationDuration = '2s';
                    heart.style.fontSize = '30px';
                    heart.style.opacity = '1';
                    document.body.appendChild(heart);
                    
                    setTimeout(() => {
                        heart.remove();
                    }, 2000);
                }, i * 30);
            }
        }

        function showFinalMessage() {
            document.getElementById('quizSection').style.display = 'none';
            document.querySelector('.heart').style.display = 'none';
            
            const finalMessage = document.getElementById('finalMessage');
            finalMessage.style.display = 'block';
            
            setTimeout(() => {
                const loveLetter = document.getElementById('loveLetter');
                loveLetter.style.display = 'block';
                loveLetter.scrollIntoView({ behavior: 'smooth' });
            }, 1500);
            
            createBigCelebration();
        }

        function createBigCelebration() {
            const hearts = ['💖', '💕', '💗', '💓', '💝', '💘', '❤️', '💜', '💛'];
            
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'floating-heart';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.top = '-50px';
                    heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    heart.style.fontSize = (Math.random() * 40 + 20) + 'px';
                    heart.style.opacity = '1';
                    document.body.appendChild(heart);
                    
                    setTimeout(() => {
                        heart.remove();
                    }, 5000);
                }, i * 50);
            }
        }

        window.onload = function() {
            createFloatingHearts();
            setTimeout(() => {
                loadQuestion();
            }, 500);
        };
    </script>
</body>
</html>
